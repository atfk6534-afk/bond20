name: Build BOND2 APK

on:
  workflow_dispatch:

  push:
    paths:
      - "*.zip"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build BOND2 Release APK
    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # 1. Checkout
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. Find ZIP
      # ============================================================

      - name: Locate BOND2 ZIP
        id: locate_zip
        shell: bash
        run: |
          set -euo pipefail

          ZIP=""

          while IFS= read -r file; do
            ZIP="$file"
            break
          done < <(
            find . \
              -maxdepth 2 \
              -type f \
              -iname "*.zip" \
              -not -path "./.git/*" \
              | sort
          )

          if [ -z "$ZIP" ]; then
            echo "::error::No BOND2 ZIP file found."
            echo "Upload the BOND2 project ZIP to the repository root."
            exit 1
          fi

          echo "======================================"
          echo "Using project ZIP:"
          echo "$ZIP"
          echo "======================================"

          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"


      # ============================================================
      # 3. Extract
      # ============================================================

      - name: Extract BOND2 project
        id: extract
        shell: bash
        run: |
          set -euo pipefail

          rm -rf extracted
          mkdir -p extracted

          unzip -q "${{ steps.locate_zip.outputs.zip }}" -d extracted

          PROJECT_DIR=""

          while IFS= read -r file; do
            PROJECT_DIR="$(dirname "$file")"
            break
          done < <(
            find extracted \
              -type f \
              -name "pubspec.yaml" \
              | sort
          )

          if [ -z "$PROJECT_DIR" ]; then
            echo "::error::pubspec.yaml was not found inside the ZIP."
            echo ""
            echo "ZIP contents:"
            find extracted -maxdepth 5 -type f | head -200
            exit 1
          fi

          echo "======================================"
          echo "BOND2 project:"
          echo "$PROJECT_DIR"
          echo "======================================"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"


      # ============================================================
      # 4. Java 17
      # ============================================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle


      # ============================================================
      # 5. Flutter
      # ============================================================

      - name: Setup Flutter 3.24.5
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable
          cache: true


      # ============================================================
      # 6. Android SDK
      # ============================================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3


      # ============================================================
      # 7. Install required Android components
      # ============================================================

      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"

          echo "Android SDK:"
          echo "$SDK_ROOT"

          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT" \
              -type f \
              -name sdkmanager \
              -executable \
              2>/dev/null \
              | head -n 1 || true)"
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found."
            find "$SDK_ROOT" -maxdepth 5 -type f -name sdkmanager 2>/dev/null || true
            exit 1
          fi

          echo "sdkmanager:"
          echo "$SDKMANAGER"

          echo "$SDK_ROOT" > /tmp/android_sdk_root

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;26.1.10909125"


      # ============================================================
      # 8. Verify Android
      # ============================================================

      - name: Verify Android environment
        shell: bash
        run: |
          set -euo pipefail

          echo "===== JAVA ====="
          java -version

          echo ""
          echo "===== FLUTTER ====="
          flutter --version

          echo ""
          echo "===== ANDROID SDK ====="
          sdkmanager --list_installed | grep -E \
            "platforms;android-35|build-tools;35|ndk;26.1.10909125" \
            || true


      # ============================================================
      # 9. Dependencies
      # ============================================================

      - name: Install Flutter dependencies
        working-directory: ${{ steps.extract.outputs.project_dir }}
        run: |
          flutter pub get


      # ============================================================
      # 10. Generate Drift
      # ============================================================

      - name: Generate Drift code
        working-directory: ${{ steps.extract.outputs.project_dir }}
        run: |
          dart run build_runner build --delete-conflicting-outputs


      # ============================================================
      # 11. Analyze
      # ============================================================

      - name: Flutter analyze
        working-directory: ${{ steps.extract.outputs.project_dir }}
        shell: bash
        run: |
          flutter analyze --no-fatal-infos


      # ============================================================
      # 12. Tests
      # ============================================================

      - name: Flutter tests
        working-directory: ${{ steps.extract.outputs.project_dir }}
        run: |
          flutter test


      # ============================================================
      # 13. Clean
      # ============================================================

      - name: Flutter clean
        working-directory: ${{ steps.extract.outputs.project_dir }}
        run: |
          flutter clean
          flutter pub get


      # ============================================================
      # 14. Build APK
      # ============================================================

      - name: Build release APK
        working-directory: ${{ steps.extract.outputs.project_dir }}
        run: |
          flutter build apk --release


      # ============================================================
      # 15. Verify APK
      # ============================================================

      - name: Verify APK
        working-directory: ${{ steps.extract.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          APK="build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "::error::APK was not generated."
            exit 1
          fi

          if [ ! -s "$APK" ]; then
            echo "::error::APK is empty."
            exit 1
          fi

          echo "======================================"
          echo "BOND2 APK SUCCESSFULLY CREATED"
          echo "======================================"

          ls -lh "$APK"


      # ============================================================
      # 16. Upload APK
      # ============================================================

      - name: Upload BOND2 APK
        uses: actions/upload-artifact@v4
        with:
          name: BOND2-release-APK
          path: ${{ steps.extract.outputs.project_dir }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
