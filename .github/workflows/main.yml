name: Build BOND2 APK

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate BOND2 project ZIP
        id: locate_zip
        shell: bash
        run: |
          set -euo pipefail

          ZIP="$(find . -maxdepth 1 -type f -name 'bond2-project*.zip' -printf '%T@ %p\n' \
            | sort -nr | head -n 1 | cut -d' ' -f2-)"

          if [ -z "${ZIP:-}" ]; then
            echo "ERROR: No bond2-project*.zip was found in the repository root." >&2
            echo "Repository contents:" >&2
            find . -maxdepth 2 -type f -print | sort >&2
            exit 1
          fi

          echo "Using project archive: $ZIP"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Extract project
        id: extract
        shell: bash
        run: |
          set -euo pipefail

          rm -rf extracted
          mkdir -p extracted

          unzip -q -o "${{ steps.locate_zip.outputs.zip }}" -d extracted

          PROJECT_DIR="$(dirname "$(find extracted -type f -name pubspec.yaml -print -quit)")"

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: pubspec.yaml was not found after extraction." >&2
            find extracted -maxdepth 4 -type f | sort >&2
            exit 1
          fi

          echo "Project directory: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Flutter 3.24.5
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35 and NDK 26.1
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"

          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" \
              -type f \
              -name sdkmanager \
              -print \
              -quit 2>/dev/null || true)"
          fi

          if [ -z "${SDKMANAGER:-}" ]; then
            echo "ERROR: sdkmanager not found." >&2
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;26.1.10909125"

      - name: Verify Android configuration
        working-directory: ${{ steps.extract.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          echo "--- Android app configuration ---"
          grep -nE 'compileSdk|targetSdk|ndkVersion' android/app/build.gradle

          echo "--- Gradle plugins ---"
          grep -nE 'com.android.application|org.jetbrains.kotlin.android' android/settings.gradle

          echo "--- Gradle wrapper ---"
          grep distributionUrl android/gradle/wrapper/gradle-wrapper.properties

      - name: Install dependencies
        working-directory: ${{ steps.extract.outputs.project_dir }}
        run: flutter pub get

      - name: Generate Drift code
        working-directory: ${{ steps.extract.outputs.project_dir }}
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Flutter analyze
        working-directory: ${{ steps.extract.outputs.project_dir }}
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Flutter tests
        working-directory: ${{ steps.extract.outputs.project_dir }}
        run: flutter test

      - name: Build release APK
        working-directory: ${{ steps.extract.outputs.project_dir }}
        run: flutter build apk --release

      - name: Verify APK
        working-directory: ${{ steps.extract.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          APK="build/app/outputs/flutter-apk/app-release.apk"

          test -s "$APK"

          echo "APK created successfully:"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BOND2-release-apk
          path: ${{ steps.extract.outputs.project_dir }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
