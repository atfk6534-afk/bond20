name: Build BOND2 APK

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate project ZIP
        id: locate_zip
        shell: bash
        run: |
          set -euo pipefail

          ZIP=""

          while IFS= read -r file; do
            ZIP="$file"
            break
          done < <(
            find . -maxdepth 3 -type f \
              \( -iname "*.zip" \) \
              -not -path "./.git/*" \
              | sort
          )

          if [ -z "$ZIP" ]; then
            echo "ERROR: No ZIP project found in repository."
            echo "The BOND2 project ZIP must be uploaded to the repository root."
            exit 1
          fi

          echo "Using project ZIP:"
          echo "$ZIP"

          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Extract project
        id: extract
        shell: bash
        run: |
          set -euo pipefail

          rm -rf extracted
          mkdir -p extracted

          unzip -q "${{ steps.locate_zip.outputs.zip }}" -d extracted

          PROJECT_DIR="$(
            find extracted \
              -type f \
              -name "pubspec.yaml" \
              -print \
              -quit \
            | xargs -r dirname
          )"

          if [ -z "$PROJECT_DIR" ] || [ ! -f "$PROJECT_DIR/pubspec.yaml" ]; then
            echo "ERROR: pubspec.yaml was not found inside the ZIP."
            echo ""
            echo "Extracted files:"
            find extracted -maxdepth 4 -type f | head -100
            exit 1
          fi

          echo "BOND2 project directory:"
          echo "$PROJECT_DIR"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable
          cache: true

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"

          if [ -z "$SDK_ROOT" ]; then
            SDK_ROOT="/usr/local/lib/android/sdk"
          fi

          echo "Android SDK root:"
          echo "$SDK_ROOT"

          SDKMANAGER=""

          # Standard GitHub Ubuntu runner location
          if [ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi

          # Search if the standard location is different
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(
              find "$SDK_ROOT" \
                -type f \
                -name sdkmanager \
                -executable \
                2>/dev/null \
                | head -n 1 || true
            )"
          fi

          # Final fallback
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(
              find /usr/local/lib/android \
                "$HOME" \
                -type f \
                -name sdkmanager \
                -executable \
                2>/dev/null \
                | head -n 1 || true
            )"
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager could not be found."
            exit 1
          fi

          echo "Using sdkmanager:"
          echo "$SDKMANAGER"

          SDK_BIN="$(dirname "$SDKMANAGER")"

          echo "$SDK_BIN" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;26.1.10909125"

      - name: Verify Android configuration
        working-directory: ${{ steps.extract.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          echo "===== Android configuration ====="

          grep -nE \
            'compileSdk|targetSdk|ndkVersion' \
            android/app/build.gradle || true

          echo ""
          echo "===== Android Gradle Plugin ====="

          grep -nE \
            'com.android.application|org.jetbrains.kotlin.android' \
            android/settings.gradle || true

          echo ""
          echo "===== Flutter doctor ====="

          flutter doctor -v

          echo ""
          echo "===== Installed Android SDK ====="

          sdkmanager --list_installed | grep -E \
            'platforms;android-35|build-tools;35|ndk;26.1.10909125' \
            || true

      - name: Install dependencies
        working-directory: ${{ steps.extract.outputs.project_dir }}
        run: |
          flutter pub get

      - name: Generate Drift code
        working-directory: ${{ steps.extract.outputs.project_dir }}
        run: |
          dart run build_runner build --delete-conflicting-outputs

      - name: Flutter analyze
        working-directory: ${{ steps.extract.outputs.project_dir }}
        run: |
          flutter analyze

      - name: Flutter tests
        working-directory: ${{ steps.extract.outputs.project_dir }}
        run: |
          flutter test

      - name: Build release APK
        working-directory: ${{ steps.extract.outputs.project_dir }}
        run: |
          flutter clean
          flutter pub get
          flutter build apk --release

      - name: Verify APK exists
        working-directory: ${{ steps.extract.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          APK="build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -s "$APK" ]; then
            echo "ERROR: Release APK was not created."
            exit 1
          fi

          echo "APK successfully created:"
          ls -lh "$APK"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: BOND2-release-apk
          path: ${{ steps.extract.outputs.project_dir }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
