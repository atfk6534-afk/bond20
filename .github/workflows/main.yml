name: Build BOND2 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify ZIP exists
        shell: bash
        run: |
          set -e
          ls -lah
          test -f bond2-project-fixed-final-v7.zip

      - name: Extract project
        shell: bash
        run: |
          set -e
          rm -rf extracted
          mkdir -p extracted
          unzip -q -o bond2-project-fixed-final-v7.zip -d extracted
          echo "Extracted files:"
          find extracted -maxdepth 2 -type f | head -100

      - name: Detect Flutter project directory
        id: project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=""

          if [ -f "extracted/bond2/pubspec.yaml" ]; then
            PROJECT_DIR="extracted/bond2"
          else
            FOUND=$(find extracted -name pubspec.yaml -type f | head -1)

            if [ -z "$FOUND" ]; then
              echo "ERROR: pubspec.yaml not found after extraction."
              exit 1
            fi

            PROJECT_DIR="$(dirname "$FOUND")"
          fi

          echo "Flutter project: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable
          cache: true

      - name: Flutter doctor
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: flutter doctor -v

      - name: Install dependencies
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: flutter pub get

      - name: Generate Drift code
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Flutter analyze
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: flutter analyze

      - name: Flutter tests
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: flutter test

      - name: Clean Flutter build
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: flutter clean

      - name: Reinstall dependencies after clean
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: flutter pub get

      - name: Generate Drift code after clean
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build release APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: flutter build apk --release

      - name: Verify APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -e
          APK="build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -s "$APK" ]; then
            echo "ERROR: APK was not created
