name: Build BOND2 APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build BOND2 Release APK
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # Find the uploaded ZIP
      # --------------------------------------------------
      - name: Find BOND2 ZIP
        id: project
        shell: bash
        run: |
          set -e

          ZIP="bond2-project-fixed-final-v8.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: $ZIP was not found in repository root."
            echo "Repository files:"
            ls -la
            exit 1
          fi

          echo "Found: $ZIP"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      # --------------------------------------------------
      # Extract ZIP
      # --------------------------------------------------
      - name: Extract BOND2 project
        id: extract
        shell: bash
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          unzip -q "${{ steps.project.outputs.zip }}" -d extracted

          PROJECT_DIR=$(find extracted -type f -name pubspec.yaml -printf '%h\n' | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: pubspec.yaml not found inside ZIP."
            find extracted -maxdepth 4 -type f | head -100
            exit 1
          fi

          echo "Project found at: $PROJECT_DIR"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      # --------------------------------------------------
      # Java
      # --------------------------------------------------
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # --------------------------------------------------
      # Flutter
      # --------------------------------------------------
      - name: Setup Flutter 3.24.5
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      # --------------------------------------------------
      # Android SDK
      # --------------------------------------------------
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK and NDK
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;26.1.10909125"

      # --------------------------------------------------
      # Flutter dependencies
      # --------------------------------------------------
      - name: Flutter clean
        working-directory: ${{ steps.extract.outputs.project_dir }}
        run: flutter clean

      - name: Flutter pub get
        working-directory: ${{ steps.extract.outputs.project_dir }}
        run: flutter pub get

      # --------------------------------------------------
      # Drift generated files
      # --------------------------------------------------
      - name: Generate Drift database code
        working-directory: ${{ steps.extract.outputs.project_dir }}
        run: |
          dart run build_runner build --delete-conflicting-outputs

      # --------------------------------------------------
      # Analyze
      # --------------------------------------------------
      - name: Flutter analyze
        working-directory: ${{ steps.extract.outputs.project_dir }}
        run: |
          flutter analyze --no-fatal-warnings --no-fatal-infos

      # --------------------------------------------------
      # Tests
      # --------------------------------------------------
      - name: Flutter tests
        working-directory: ${{ steps.extract.outputs.project_dir }}
        run: flutter test

      # --------------------------------------------------
      # Build APK
      # --------------------------------------------------
      - name: Build release APK
        working-directory: ${{ steps.extract.outputs.project_dir }}
        run: flutter build apk --release

      # --------------------------------------------------
      # Verify APK
      # --------------------------------------------------
      - name: Verify APK
        working-directory: ${{ steps.extract.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          APK="build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -s "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK successfully generated:"
          ls -lh "$APK"

      # --------------------------------------------------
      # Upload APK
      # --------------------------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BOND2-release-APK
          path: ${{ steps.extract.outputs.project_dir }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
