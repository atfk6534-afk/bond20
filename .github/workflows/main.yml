name: Build BOND2 APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check project ZIP
        run: |
          echo "Repository files:"
          ls -lah

          test -f "bond2-project-fixed-final-v6.zip" || {
            echo "ERROR: bond2-project-fixed-final-v6.zip not found!"
            exit 1
          }

      - name: Extract BOND2 project
        run: |
          rm -rf extracted
          mkdir extracted

          unzip -q -o "bond2-project-fixed-final-v6.zip" -d extracted

          echo "Extracted project:"
          find extracted -maxdepth 3 -type f | head -100

      - name: Locate Flutter project
        id: project
        run: |
          PROJECT_DIR=$(find extracted -name "pubspec.yaml" -type f -print -quit | xargs dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: pubspec.yaml was not found inside the ZIP."
            exit 1
          fi

          echo "Flutter project: $PROJECT_DIR"
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Flutter clean
        working-directory: ${{ steps.project.outputs.dir }}
        run: flutter clean

      - name: Get dependencies
        working-directory: ${{ steps.project.outputs.dir }}
        run: flutter pub get

      - name: Generate Drift code
        working-directory: ${{ steps.project.outputs.dir }}
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Run Flutter analyze
        working-directory: ${{ steps.project.outputs.dir }}
        run: flutter analyze

      - name: Run Flutter tests
        working-directory: ${{ steps.project.outputs.dir }}
        run: flutter test

      - name: Build release APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: flutter build apk --release

      - name: Verify APK exists
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          test -f "build/app/outputs/flutter-apk/app-release.apk" || {
            echo "ERROR: APK was not generated!"
            exit 1
          }

          ls -lh build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bond2-release-apk
          path: ${{ steps.project.outputs.dir }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
