name: Build BOND2 Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build BOND2 APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find project ZIP
        id: zip
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 2 -type f -name 'bond2-project-fixed-final-v6.zip' | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: bond2-project-fixed-final-v6.zip was not found."
            echo "Files in repository:"
            find . -maxdepth 3 -type f | sort | head -200
            exit 1
          fi

          echo "Found ZIP: $ZIP_FILE"
          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Extract project
        shell: bash
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          unzip -o "${{ steps.zip.outputs.zip_file }}" -d extracted

          echo "Extracted files:"
          find extracted -maxdepth 3 -type f \
            \( -name pubspec.yaml -o -name build.gradle -o -name settings.gradle \) \
            -print

      - name: Locate Flutter project
        id: project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=$(find extracted -type f -name pubspec.yaml -print \
            | sed 's|/pubspec.yaml$||' \
            | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: No Flutter project found after extraction."
            exit 1
          fi

          echo "Flutter project: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Show Flutter environment
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          flutter --version
          dart --version
          flutter doctor -v

      - name: Flutter clean
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: flutter clean

      - name: Get dependencies
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: flutter pub get

      - name: Generate Drift code
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        working-directory: ${{ steps.project.outputs.project_dir }}
        continue-on-error: true
        run: flutter analyze

      - name: Run tests
        working-directory: ${{ steps.project.outputs.project_dir }}
        continue-on-error: true
        run: flutter test

      - name: Build release APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: flutter build apk --release

      - name: Verify APK exists
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          set -e

          APK="build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated."
            find build -type f -name '*.apk' -print || true
            exit 1
          fi

          echo "APK successfully generated:"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bond2-release-apk
          path: ${{ steps.project.outputs.project_dir }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
