name: BOND2 - Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build BOND2 APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Show repository files
        run: |
          echo "Repository root:"
          pwd
          echo
          ls -lah

      - name: Locate BOND2 ZIP
        id: locate
        shell: bash
        run: |
          set -euo pipefail

          ZIP="$(find . -maxdepth 2 -type f \
            \( -name 'bond2-project-fixed-final-v10.zip' \
            -o -name 'bond2-project-fixed-final-v*.zip' \) \
            | head -n 1)"

          if [ -z "$ZIP" ]; then
            echo "ERROR: BOND2 ZIP was not found."
            echo
            echo "Available ZIP files:"
            find . -maxdepth 3 -type f -iname '*.zip' -print || true
            exit 1
          fi

          echo "Using ZIP: $ZIP"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Extract BOND2
        id: extract
        shell: bash
        run: |
          set -euo pipefail

          rm -rf extracted
          mkdir -p extracted

          unzip -q "${{ steps.locate.outputs.zip }}" -d extracted

          echo "Extracted structure:"
          find extracted -maxdepth 3 -type f \
            \( -name 'pubspec.yaml' -o -name 'settings.gradle*' -o -name 'build.gradle*' \) \
            -print

          PROJECT_DIR="$(find extracted -type f -name pubspec.yaml -printf '%h\n' | head -n 1)"

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Could not find pubspec.yaml."
            exit 1
          fi

          echo "Flutter project:"
          echo "$PROJECT_DIR"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter 3.24.5
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35 and NDK 26
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;26.1.10909125"

      - name: Verify Android configuration
        working-directory: ${{ steps.extract.outputs.project_dir }}
        shell: bash
        run: |
          echo "Flutter:"
          flutter --version

          echo
          echo "Android configuration:"
          grep -R \
            -n \
            -E 'compileSdk|compileSdkVersion|ndkVersion' \
            android \
            --include='*.gradle' \
            --include='*.gradle.kts' \
            || true

      - name: Flutter clean
        working-directory: ${{ steps.extract.outputs.project_dir }}
        run: flutter clean

      - name: Flutter pub get
        working-directory: ${{ steps.extract.outputs.project_dir }}
        run: flutter pub get

      - name: Generate Drift code
        working-directory: ${{ steps.extract.outputs.project_dir }}
        run: |
          dart run build_runner build --delete-conflicting-outputs

      - name: Flutter analyze
        working-directory: ${{ steps.extract.outputs.project_dir }}
        run: |
          flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Flutter tests
        working-directory: ${{ steps.extract.outputs.project_dir }}
        run: flutter test

      - name: Build release APK
        working-directory: ${{ steps.extract.outputs.project_dir }}
        run: |
          flutter build apk --release --verbose

      - name: Verify APK
        id: apk
        working-directory: ${{ steps.extract.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          APK="build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          if [ ! -s "$APK" ]; then
            echo "ERROR: APK exists but is empty."
            exit 1
          fi

          echo "APK successfully generated:"
          ls -lh "$APK"

          echo "apk=$APK" >> "$GITHUB_OUTPUT"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: BOND2-release-APK
          path: ${{ steps.extract.outputs.project_dir }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
