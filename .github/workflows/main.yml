name: Build BOND2 APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build BOND2 Release APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find project ZIP
        id: project
        shell: bash
        run: |
          set -e

          ZIP="bond2-project-fixed-final-v9.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: $ZIP not found."
            ls -la
            exit 1
          fi

          echo "Found $ZIP"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Extract project
        id: extract
        shell: bash
        run: |
          set -e

          rm -rf extracted
          mkdir extracted

          unzip -q "${{ steps.project.outputs.zip }}" -d extracted

          PROJECT_DIR=$(find extracted -type f -name pubspec.yaml -printf '%h\n' | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: pubspec.yaml not found."
            find extracted -maxdepth 4 -type f
            exit 1
          fi

          echo "Project: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35 and NDK
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;26.1.10909125"

      - name: Flutter clean
        working-directory: ${{ steps.extract.outputs.project_dir }}
        run: flutter clean

      - name: Flutter pub get
        working-directory: ${{ steps.extract.outputs.project_dir }}
        run: flutter pub get

      - name: Generate Drift code
        working-directory: ${{ steps.extract.outputs.project_dir }}
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Flutter analyze
        working-directory: ${{ steps.extract.outputs.project_dir }}
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Flutter tests
        working-directory: ${{ steps.extract.outputs.project_dir }}
        run: flutter test

      - name: Build release APK
        working-directory: ${{ steps.extract.outputs.project_dir }}
        run: flutter build apk --release

      - name: Verify APK
        working-directory: ${{ steps.extract.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          APK="build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -s "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK generated successfully:"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BOND2-release-APK
          path: ${{ steps.extract.outputs.project_dir }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
