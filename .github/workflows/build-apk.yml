name: Build BOND2 APK

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build BOND2 Release APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Find BOND2 ZIP
        id: zip
        shell: bash
        run: |
          set -euo pipefail

          ZIP="$(find . -maxdepth 1 -type f \
            -iname 'bond2-project-fixed-final-v17.zip' \
            -print -quit)"

          if [ -z "$ZIP" ]; then
            echo "ERROR: bond2-project-fixed-final-v17.zip not found."
            echo "Files in repository:"
            find . -maxdepth 1 -type f -printf '%f\n'
            exit 1
          fi

          echo "Found ZIP: $ZIP"
          echo "zip_file=${ZIP#./}" >> "$GITHUB_OUTPUT"

      - name: Extract BOND2 project
        id: extract
        shell: bash
        run: |
          set -euo pipefail

          rm -rf extracted
          mkdir -p extracted

          unzip -q -o "${{ steps.zip.outputs.zip_file }}" -d extracted

          PROJECT_DIR="$(dirname "$(find extracted \
            -type f \
            -name pubspec.yaml \
            -print -quit)")"

          if [ -z "$PROJECT_DIR" ] || \
             [ ! -f "$PROJECT_DIR/pubspec.yaml" ]; then
            echo "ERROR: pubspec.yaml not found."
            find extracted -maxdepth 4 -type f | head -200
            exit 1
          fi

          echo "Project directory: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;26.1.10909125"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable
          cache: true

      - name: Flutter clean
        working-directory: ${{ steps.extract.outputs.project_dir }}
        run: flutter clean

      - name: Install dependencies
        working-directory: ${{ steps.extract.outputs.project_dir }}
        run: flutter pub get

      - name: Generate Drift code
        working-directory: ${{ steps.extract.outputs.project_dir }}
        run: |
          dart run build_runner build \
            --delete-conflicting-outputs

      - name: Flutter analyze
        working-directory: ${{ steps.extract.outputs.project_dir }}
        run: flutter analyze --no-fatal-infos
        continue-on-error: true

      - name: Flutter tests
        working-directory: ${{ steps.extract.outputs.project_dir }}
        run: flutter test
        continue-on-error: true

      - name: Build release APK
        working-directory: ${{ steps.extract.outputs.project_dir }}
        run: flutter build apk --release

      - name: Verify APK
        working-directory: ${{ steps.extract.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          APK="build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -s "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK generated successfully:"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bond2-release-apk
          path: ${{ steps.extract.outputs.project_dir }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
