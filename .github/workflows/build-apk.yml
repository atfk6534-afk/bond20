name: Build BOND2 APK

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build BOND2 Release APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate BOND2 project ZIP
        id: locate_zip
        shell: bash
        run: |
          set -euo pipefail

          ZIP="$(find . -maxdepth 1 -type f -iname 'bond2-project-fixed-final-v12.zip' -print -quit)"

          if [ -z "$ZIP" ]; then
            echo "ERROR: bond2-project-fixed-final-v12.zip was not found."
            echo "Files in repository root:"
            find . -maxdepth 1 -type f -print
            exit 1
          fi

          echo "Found: $ZIP"
          echo "zip_file=${ZIP#./}" >> "$GITHUB_OUTPUT"

      - name: Extract project ZIP
        id: extract
        shell: bash
        run: |
          set -euo pipefail

          rm -rf extracted
          mkdir -p extracted

          unzip -q -o "${{ steps.locate_zip.outputs.zip_file }}" -d extracted

          PROJECT_DIR="$(dirname "$(find extracted -type f -name pubspec.yaml -print -quit)")"

          if [ -z "$PROJECT_DIR" ] || [ ! -f "$PROJECT_DIR/pubspec.yaml" ]; then
            echo "ERROR: Flutter pubspec.yaml was not found after extraction."
            echo "Extracted files:"
            find extracted -maxdepth 4 -type f | head -200
            exit 1
          fi

          echo "Flutter project directory: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35 and NDK 26.1
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;26.1.10909125"

      - name: Verify Android SDK
        shell: bash
        run: |
          set -euo pipefail

          echo "ANDROID_HOME=${ANDROID_HOME:-}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-}"

          sdkmanager --list_installed | grep -E \
            'platforms;android-35|build-tools;35.0.0|ndk;26.1.10909125'

      - name: Setup Flutter 3.24.5
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable
          cache: true

      - name: Flutter clean
        working-directory: ${{ steps.extract.outputs.project_dir }}
        run: flutter clean

      - name: Verify BOND2 Android configuration
        working-directory: ${{ steps.extract.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          echo "=== android/app/build.gradle ==="
          grep -nE 'compileSdk|targetSdk|ndkVersion' android/app/build.gradle

          echo
          echo "=== android/build.gradle ==="
          cat android/build.gradle

          echo
          echo "=== gradle wrapper ==="
          grep distributionUrl android/gradle/wrapper/gradle-wrapper.properties

          echo
          echo "=== settings.gradle ==="
          grep -nE 'com.android.application|org.jetbrains.kotlin.android' android/settings.gradle

          echo
          echo "=== Checking required values ==="

          grep -q 'compileSdk 35' android/app/build.gradle
          grep -q 'targetSdk 35' android/app/build.gradle
          grep -q 'ndkVersion "26.1.10909125"' android/app/build.gradle

          echo "Android configuration verification passed."

      - name: Flutter doctor
        working-directory: ${{ steps.extract.outputs.project_dir }}
        run: flutter doctor -v

      - name: Install dependencies
        working-directory: ${{ steps.extract.outputs.project_dir }}
        run: flutter pub get

      - name: Generate Drift database code
        working-directory: ${{ steps.extract.outputs.project_dir }}
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Flutter analyze
        working-directory: ${{ steps.extract.outputs.project_dir }}
        continue-on-error: true
        run: flutter analyze --no-fatal-infos

      - name: Flutter tests
        working-directory: ${{ steps.extract.outputs.project_dir }}
        continue-on-error: true
        run: flutter test

      - name: Build release APK
        working-directory: ${{ steps.extract.outputs.project_dir }}
        run: flutter build apk --release

      - name: Verify APK
        working-directory: ${{ steps.extract.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          APK="build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -s "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK successfully generated:"
          ls -lh "$APK"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: bond2-release-apk
          path: ${{ steps.extract.outputs.project_dir }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: errorname: Build BOND2 APK

